<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRide Admin Login</title>

    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #102a43;
        }

        .box {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px #102a4315;
        }

        label {
            display: block;
            margin-top: 17px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd6e0;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #ffc629;
            color: #102a43;
            border: 0;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #ffe5e5;
            color: #9b1c1c;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔐 Admin Login</h1>
    <p>Sign in to review driver applications.</p>

    <p th:if="${error}" class="error" th:text="${error}"></p>

    <form th:action="@{/admin/login}" method="post">

        <label for="username">Username</label>
        <input id="username" type="text"
               name="username" required autocomplete="username">

        <label for="password">Password</label>
        <input id="password" type="password"
               name="password" required autocomplete="current-password">

        <button type="submit">Login</button>

    </form>

    <p><a th:href="@{/}">← Back to Home</a></p>

</div>

</body>
</html>
