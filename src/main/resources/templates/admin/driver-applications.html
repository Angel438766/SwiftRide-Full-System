<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Applications | SwiftRide</title>

    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #102a43;
        }

        .container {
            max-width: 1300px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logout, .action {
            display: inline-block;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #071b35;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .table-wrap {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th { background: #071b35; color: white; }

        .status {
            font-weight: bold;
        }

        .pending { color: #986700; }
        .approved { color: #167440; }
        .rejected { color: #a32626; }

        .approve { background: #168447; }
        .reject { background: #b42323; }

        .actions {
            display: flex;
            gap: 8px;
        }

        form { margin: 0; }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div>
            <h1>SwiftRide Admin</h1>
            <p>Review and manage driver applications.</p>
        </div>

        <form th:action="@{/admin/logout}" method="post">
            <button class="logout" type="submit">Logout</button>
        </form>
    </div>

    <div class="table-wrap">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Driver Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Licence</th>
                <th>Vehicle No.</th>
                <th>Category</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="app : ${applications}">

                <td th:text="${app.id}"></td>
                <td th:text="${app.fullName}"></td>
                <td th:text="${app.email}"></td>
                <td th:text="${app.phone}"></td>
                <td th:text="${app.licenseNumber}"></td>
                <td th:text="${app.vehicleNumber}"></td>
                <td th:text="${app.vehicleCategory}"></td>

                <td>
                    <span class="status"
                          th:classappend="${app.status == 'PENDING'} ? ' pending' :
                                          (${app.status == 'APPROVED'} ? ' approved' : ' rejected')"
                          th:text="${app.status}"></span>
                </td>

                <td>
                    <div class="actions"
                         th:if="${app.status == 'PENDING'}">

                        <form th:action="@{/admin/driver-applications/{id}/approve(id=${app.id})}"
                              method="post">
                            <button class="action approve" type="submit">
                                Approve
                            </button>
                        </form>

                        <form th:action="@{/admin/driver-applications/{id}/reject(id=${app.id})}"
                              method="post">
                            <button class="action reject" type="submit">
                                Reject
                            </button>
                        </form>

                    </div>

                    <span th:if="${app.status != 'PENDING'}">
                        No action needed
                    </span>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(applications)}">
                <td colspan="9">No driver applications have been submitted yet.</td>
            </tr>

            </tbody>
        </table>

    </div>

    <p><a th:href="@{/}">Back to Home</a></p>

</div>

</body>
</html>
