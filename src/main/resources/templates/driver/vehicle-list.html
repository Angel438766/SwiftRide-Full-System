
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles</title>
</head>
<body>

<h1>Vehicle Management</h1>

<a th:href="@{/vehicles/new}">Add Vehicle</a>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Vehicle Number</th>
        <th>Vehicle Type</th>
        <th>Seats</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="vehicle : ${vehicles}">
        <td th:text="${vehicle.id}"></td>
        <td th:text="${vehicle.vehicleNumber}"></td>
        <td th:text="${vehicle.vehicleType}"></td>
        <td th:text="${vehicle.seats}"></td>
        <td>
            <a th:href="@{/vehicles/edit/{id}(id=${vehicle.id})}">
                Edit
            </a>

            |

            <a th:href="@{/vehicles/delete/{id}(id=${vehicle.id})}"
               onclick="return confirm('Are you sure you want to delete this vehicle?')">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/}">Home</a>

</body>
</html>
