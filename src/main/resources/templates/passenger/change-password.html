
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        h1 {
            color: #172554;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 16px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Change Password</h1>

    <p class="success"
       th:if="${success}"
       th:text="${success}"></p>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

    <form th:action="@{/passengers/change-password}" method="post">

        <label for="currentPassword">Current Password</label>
        <input type="password"
               id="currentPassword"
               name="currentPassword"
               autocomplete="current-password"
               required>

        <label for="newPassword">New Password</label>
        <input type="password"
               id="newPassword"
               name="newPassword"
               minlength="6"
               autocomplete="new-password"
               required>

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               minlength="6"
               autocomplete="new-password"
               required>

        <button type="submit">Change Password</button>

    </form>

    <a class="back" th:href="@{/passengers/dashboard}">
        Back to Dashboard
    </a>

</div>
</body>
</html>
