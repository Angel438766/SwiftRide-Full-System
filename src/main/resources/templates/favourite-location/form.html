
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Location Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 35px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #1769aa;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        a { background: #555; }
    </style>
</head>
<body>
<div class="container">

    <h1 th:text="${pageTitle}">Favourite Location Form</h1>

    <form th:object="${location}"
          th:action="${location.id == null}
                     ? @{/favourite-locations/save}
                     : @{/favourite-locations/update/{id}(id=${location.id})}"
          method="post">

        <label for="locationName">Location Name</label>
        <input type="text"
               id="locationName"
               th:field="*{locationName}"
               placeholder="Example: Home or Work"
               required>

        <label for="address">Address</label>
        <input type="text"
               id="address"
               th:field="*{address}"
               placeholder="Enter the full address"
               required>

        <button type="submit">Save Location</button>
        <a th:href="@{/favourite-locations}">Cancel</a>

    </form>

</div>
</body>
</html>
