<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRide - Safe, Fast, Reliable</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #07162c;
            color: white;
            overflow-x: hidden;
        }

        /* Top Navigation Bar Styling */
        .navbar {
            background-color: #0c2340;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffc107;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-sub {
            font-size: 12px;
            color: #ccc;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffc107;
        }

        /* Full Screen Hero Section Configuration */
        .hero-section {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center; /* මැදට තිබූ අනුපාතය */
            justify-content: flex-start;
            padding: 0 80px;
            overflow: hidden;
        }

        /* Background Full Screen Image */
        .hero-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Text Content Layer - Shifted Upwards */
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 550px;
            padding: 20px;
            margin-top: -120px; /* අකුරු ටික ලස්සනට උඩට ගැනීමට මෙතනින් සකස් කළා */
        }

        .hero-tag {
            color: #ffc107;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .hero-title {
            font-size: 52px;
            font-weight: 900;
            line-height: 1.1;
            margin: 0 0 20px 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .hero-desc {
            color: #ddd;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 35px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .btn-book {
            display: inline-block;
            padding: 14px 30px;
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-book:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }

        /* Responsive Modifications for Phones */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                text-align: center;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            .hero-section {
                padding: 40px 20px;
                justify-content: center;
                text-align: center;
            }
            .hero-content {
                margin-top: 0; /* ෆෝන් එකේදී සාමාන්‍ය පරිදි පෙන්වීමට */
            }
            .hero-title {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

<!-- Top Navigation Bar Menu -->
<div class="navbar">
    <div class="logo-section">
        <div class="logo-title">🚖 SwiftRide</div>
        <div class="logo-sub">Your Journey, Our Priority</div>
    </div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="templates/about.html">About Us</a>
        <a href="templates/contact.html">Contact Us</a>
        <a href="templates/passenger/register.html">Sign Up</a>
        <a href="templates/passenger/login.html">Passenger Login</a>
        <a href="templates/driver/login.html">Driver Login</a>
        <a href="templates/driver/form.html">Become a Driver</a>
    </div>
</div>

<!-- Full Screen Hero Layout Area -->
<div class="hero-section">
    <!-- Background Pic Insertion -->
    <img class="hero-bg-img" src="Cinematic Sunset Taxi by the Waterfront.png" alt="SwiftRide Taxi Backdrop">

    <!-- Shifted Content Layer over Image -->
    <div class="hero-content">
        <div class="hero-tag">SAFE • FAST • RELIABLE</div>
        <h1 class="hero-title">ORDER A TAXI<br><span style="color: #ffc107;">RIGHT NOW!</span></h1>
        <p class="hero-desc">Travel with comfort and confidence. Book your ride, manage your journey and get where you need to go with SwiftRide.</p>
        <a href="templates/passenger/register.html" class="btn-book">🚖 Book a Ride →</a>
    </div>
</div>

</body>
</html>
