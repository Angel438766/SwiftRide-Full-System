
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Locations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 35px;
            background: #f4f6f9;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 { color: #243b55; }

        a, button {
            display: inline-block;
            padding: 9px 13px;
            margin: 4px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #1769aa;
            color: white;
        }

        .delete { background: #c62828; }
        .home { background: #555; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th { background: #e8eef5; }
    </style>
</head>
<body>
<div class="container">

    <h1>Favourite Locations</h1>
    <p>Save and manage your favourite places.</p>

    <a th:href="@{/favourite-locations/new}">+ Add Location</a>
    <a th:href="@{/}" class="home">Home</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Location Name</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="location : ${locations}">
            <td th:text="${location.id}"></td>
            <td th:text="${location.locationName}"></td>
            <td th:text="${location.address}"></td>
            <td>
                <a th:href="@{/favourite-locations/edit/{id}(id=${location.id})}">
                    Edit
                </a>

                <form th:action="@{/favourite-locations/delete/{id}(id=${location.id})}"
                      method="post" style="display:inline"
                      onsubmit="return confirm('Delete this location?');">
                    <button type="submit" class="delete">Delete</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(locations)}">
            <td colspan="4">No favourite locations added yet.</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
