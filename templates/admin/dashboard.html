<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRide Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #102a43;
        }
        /* ඡායාරූපයේ ඇති පරිදිම තද නිල් පාට ප්‍රධාන Header එක */
        .admin-header {
            background-color: #0c2340;
            color: white;
            padding: 25px 40px;
            width: 100%;
        }
        .admin-header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }
        .admin-header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #ccc;
        }
        /* Dashboard Container & Cards Grid Layout */
        .dashboard-container {
            max-width: 1200px;
            width: 90%;
            margin: 40px auto;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
        }
        .card h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #111;
        }
        .card p {
            margin: 0 0 25px 0;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        /* ඡායාරූපයේ ඇති පරිදිම පිරිසිදු නිල් පාට බොත්තම් */
        .btn-manage {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            width: fit-content;
        }
        .btn-manage:hover {
            background-color: #0b5ed7;
        }
        /* ඡායාරූපයේ ඇති පරිදිම රතු පාට Logout බොත්තම */
        .btn-logout {
            display: inline-block;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            width: fit-content;
            margin-top: 10px;
        }
        .btn-logout:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>

<!-- Top Admin Header Section -->
<div class="admin-header">
    <h1>SwiftRide Admin Dashboard</h1>
    <p>Manage your taxi booking platform</p>
</div>

<!-- Main Cards Grid Dashboard Configuration -->
<div class="dashboard-container">
    <div class="grid-container">

        <!-- 1. Driver Applications Card -->
        <div class="card">
            <div>
                <h2>Driver Applications</h2>
                <p>Review driver registrations and approve or reject applications.</p>
            </div>
            <a href="../driver-applications.html" class="btn-manage">Manage Drivers</a>
        </div>

        <!-- 2. Contact Messages Card -->
        <div class="card">
            <div>
                <h2>Contact Messages</h2>
                <p>Read messages submitted through the SwiftRide contact form.</p>
            </div>
            <a href="../contact.html" class="btn-manage">View Messages</a>
        </div>

    </div>

    <!-- Logout Action Button -->
    <a href="../../index.html" class="btn-logout">Logout</a>
</div>

</body>
</html>
