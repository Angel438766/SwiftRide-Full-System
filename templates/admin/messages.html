<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages | SwiftRide Admin</title>
    <style>
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f6fb;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f3f6fb;
            padding-bottom: 15px;
        }
        h2 { color: #0c2340; margin: 0; }
        p { color: #666; margin: 5px 0 0 0; }
        .btn-logout {
            background-color: #0c2340;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .msg-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .msg-table th, .msg-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }
        .msg-table th {
            background-color: #0c2340;
            color: white;
            font-weight: bold;
        }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
        }
        .btn-read { background-color: #198754; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-read:hover { background-color: #157347; }
        .btn-delete:hover { background-color: #bb2d3b; }
        .footer-links { margin-top: 30px; }
        .footer-links a { color: #0d6efd; text-decoration: none; font-weight: bold; }
        .footer-links a:hover { text-decoration: underline; }
        .loading-text { text-align: center; padding: 20px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

<div class="container">

    <div class="header-section">
        <div>
            <h2>✉️ Customer Contact Messages</h2>
            <p>View live feedback and inquiries submitted by real website passengers.</p>
        </div>
        <a href="../../index.html" class="btn-logout">Logout</a>
    </div>

    <!-- දත්ත ලෝඩ් වන තෙක් පෙන්වන Loading පණිවිඩය -->
    <div id="loading" class="loading-text">🔄 Fetching real-time passenger messages from Supabase database...</div>

    <table class="msg-table" id="messagesTable" style="display: none;">
        <thead>
        <tr>
            <th>Msg ID</th>
            <th>Passenger Name</th>
            <th>Email</th>
            <th>Message Content</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <!-- සැබෑ දත්ත ජාවාස්ක්‍රිප්ට් මඟින් මෙතැනට ලෝඩ් වේ -->
        </tbody>
    </table>

    <div class="footer-links">
        <a href="dashboard.html">← Back to Admin Dashboard</a>
    </div>

</div>

<!-- Supabase SDK ඇතුළත් කිරීම -->
<script src="https://jsdelivr.net"></script>
<script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_TSPXFTGaeIMHzvvUpPpGkQ_ZHN-sgwx";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. Supabase එකෙන් සැබෑ පණිවිඩ සජීවීව ලෝඩ් කරන Function එක
    async function fetchLiveMessages() {
        try {
            const { data, error } = await supabase
                .from('contacts') // 👈 ඔයාගේ Supabase Table එකේ නම (contacts හෝ contact_messages)
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px; color: #777;">No real passenger messages found in the database.</td></tr>`;
            } else {
                data.forEach((msg) => {
                    const statusColor = msg.status === 'Read' ? '#198754' : '#fd7e14';
                    const row = `
                        <tr>
                            <td>#${msg.id}</td>
                            <td><strong>${msg.name || 'N/A'}</strong></td>
                            <td>${msg.email || 'N/A'}</td>
                            <td>"${msg.message || msg.message_content || 'N/A'}"</td>
                            <td><span id="status-${msg.id}" style="color: ${statusColor}; font-weight: bold;">${msg.status || 'Unread'}</span></td>
                            <td>
                                <button class="btn-action btn-read" onclick="markAsRead(${msg.id})">Mark Read</button>
                                <button class="btn-action btn-delete" onclick="deleteMessage(${msg.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('messagesTable').style.display = 'table';

        } catch (err) {
            console.error(err);
            document.getElementById('loading').innerText = "⚠️ Error loading live messages: " + err.message;
        }
    }

    // 2. Mark as Read කිරීමේ සජීවී ක්‍රියාකාරීත්වය
    async function markAsRead(id) {
        try {
            const { error } = await supabase
                .from('contacts')
                .update({ status: 'Read' })
                .eq('id', id);

            if (error) throw error;

            const statusEl = document.getElementById('status-' + id);
            statusEl.innerText = 'Read';
            statusEl.style.color = '#198754';
            alert('Message #' + id + ' marked as Read in live database!');

        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    // 3. පණිවිඩය සැබැවින්ම Database එකෙන් මකා දැමීම
    async function deleteMessage(id) {
        const confirmDel = confirm('Are you sure you want to permanently delete message #' + id + ' from database?');
        if (!confirmDel) return;

        try {
            const { error } = await supabase
                .from('contacts')
                .delete()
                .eq('id', id);

            if (error) throw error;

            alert('Message #' + id + ' permanently deleted from Supabase!');
            fetchLiveMessages(); // වගුව සජීවීව Refresh කිරීම

        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    window.onload = fetchLiveMessages;
</script>

</body>
</html>
