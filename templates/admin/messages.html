<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Contact Messages | SwiftRide</title>
    <style>
        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f6fb;
            color: #102a43;
        }

        /* ඡායාරූපයේ තියෙන පරිදිම තද නිල් පාට Top Banner එක */
        .header-banner {
            background-color: #071b35;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 35px 20px;
            display: block;
            width: 100%;
        }

        .header-banner h1 {
            color: #ffc629; /* ਰන්වන් කහ පැහැති SwiftRide */
            font-size: 32px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .header-banner p {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            color: white;
        }

        .main-container {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 20px;
        }

        /* ඡායාරූපයේ ඇති පරිදිම Back to Home බොත්තම */
        .btn-back {
            display: inline-block;
            background-color: #ffc629;
            color: #102a43;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-back:hover {
            background-color: #ffdb70;
        }

        h2.section-title {
            color: #102a43;
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* ඡායාරූපයේ ඇති පරිදිම අතිශය ලස්සන Cards Layout මෝස්තරය */
        .message-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border-left: 5px solid #ffc629; /* වම් පැත්තේ රන්වන් කහ දාරය */
            box-shadow: 0 4px 15px rgba(16, 42, 67, 0.05);
            margin-bottom: 25px;
            position: relative;
        }

        .message-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 42, 67, 0.08);
        }

        .passenger-name {
            color: #087f8c;
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 15px 0;
        }

        .info-label {
            font-weight: bold;
            color: #102a43;
            display: block;
            margin-top: 10px;
        }

        .info-value {
            color: #526579;
            line-height: 1.6;
            margin: 5px 0 15px 0;
            word-break: break-word;
        }

        .timestamp {
            font-size: 12px;
            color: #9fb3c8;
            margin-top: 15px;
        }

        /* පණිවිඩය මකා දැමීමට පහළින් එක් කළ කුඩා රතු බොත්තම */
        .btn-delete {
            position: absolute;
            top: 30px;
            right: 30px;
            background-color: #ffebee;
            color: #dc3545;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-delete:hover { background-color: #dc3545; color: white; }

        .empty-text {
            text-align: center;
            padding: 40px;
            color: #657786;
            font-size: 16px;
            background: white;
            border-radius: 14px;
            border: 1px dashed #ccd6e0;
        }
    </style>
</head>
<body>

<!-- Top Navigation Header Banner Line -->
<div class="header-banner">
    <h1>SwiftRide</h1>
    <p>Customer Contact Messages</p>
</div>

<!-- Main Dynamic Content Container Framework -->
<div class="main-container">

    <!-- ඇඩ්මින් ඩෑෂ්බෝඩ් එකට ආපහු යන බොත්තම (404 නොවී වැඩ කිරීමට සකස් කළා) -->
    <a href="dashboard.html" class="btn-back">← Back to Home</a>

    <h2 class="section-title">Received Messages</h2>

    <!-- ජාවාස්ක්‍රිප්ට් මඟින් ලස්සන කාඩ්ස් සජීවීව මෙතැනට ලෝඩ් වේ -->
    <div id="messagesContainer"></div>

</div>

<script>
    function loadLiveCards() {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        // මතකයෙන් passengersලා එවපු සැබෑ දත්ත කියවීම
        let messages = JSON.parse(localStorage.getItem('swiftRideMessages')) || [];

        if (messages.length === 0) {
            container.innerHTML = `<div class="empty-text">No passenger messages have been submitted yet. Go to public Contact Us and send one!</div>`;
            return;
        }

        // අලුත්ම පණිවිඩ උඩින්ම පෙන්වීමට Reverse කර Cards ලෙස සකස් කිරීම
        messages.reverse().forEach((msg) => {
            const currentDateTime = new Date().toISOString().replace('T', ' ').substring(0, 19);

            const cardHtml = `
                <div class="message-card" id="card-${msg.id}">
                    <button class="btn-delete" onclick="deleteCard(${msg.id})">Delete</button>
                    <div class="passenger-name">${msg.name || 'Anonymous Passenger'}</div>

                    <span class="info-label">Email:</span>
                    <div class="info-value">${msg.email || 'No email provided'}</div>

                    <span class="info-label">Message:</span>
                    <div class="info-value">${msg.message || 'Empty message content'}</div>

                    <div class="timestamp">Received: ${msg.time || currentDateTime}</div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    // කාඩ් එකක් මකා දැමීම
    function deleteCard(id) {
        if (!confirm('Are you sure you want to delete this contact message?')) return;

        let messages = JSON.parse(localStorage.getItem('swiftRideMessages')) || [];
        messages = messages.filter(msg => msg.id !== id);
        localStorage.setItem('swiftRideMessages', JSON.stringify(messages));

        alert('Message deleted successfully.');
        loadLiveCards(); // පිටුව සජීවීව Refresh කිරීම
    }

    window.onload = loadLiveCards;
</script>

</body>
</html>
