<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #102a43;
        }
        .box {
            width: 380px;
            max-width: 92%;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 22px #102a4320;
        }
        h1 { color: #087f8c; text-align: center; margin-top: 0; }
        p { text-align: center; color: #526579; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #ffc629;
            color: #102a43;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #ffdb70; }
        a { color: #087f8c; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="box">
    <h1>Admin Login</h1>
    <p>Sign in to review driver applications.</p>

    <!-- 405 Error එක වළක්වන පරිදි ID එක පමණක් සකස් කළ පෝරමය -->
    <form id="adminLoginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Login</button>
    </form>

    <!-- යට තියෙන බොත්තම 404 Error නොවී කෙලින්ම ප්‍රධාන මුල් පිටුවට පස්සට යන ලෙස නිවැරදි කළා -->
    <p style="text-align: center; margin-top: 25px;">
        <a href="/SwiftRide-Full-System/index.html">← Back to Home Dashboard</a>
    </p>
</div>

<!-- 405 Not Allowed Error එක වළක්වා සාර්ථකව Redirection එක සිදුකරන ජාවාස්ක්‍රිප්ට් கේතය -->
<script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 👈 405 Error එක එන එක සම්පූර්ණයෙන්ම වළක්වනවා!

        alert("Login Successful! Welcome to Administration Dashboard.");

        // සාර්ථකව ලොගින් වුණු පසු කෙළින්ම එකම admin ෆෝල්ඩරයේ ඇති dashboard.html පිටුවට රැගෙන යයි
        window.location.href = "dashboard.html";
    });
</script>

</body>
</html>
