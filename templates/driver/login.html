<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Driver Login</h1>

    <p th:if="${error}" th:text="${error}" class="error"></p>

    <form th:action="@{/driver-login}" method="post">

        <label for="email">Email Address</label>
        <input type="email"
               id="email"
               name="email"
               autocomplete="username"
               required>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="current-password"
               required>

        <button type="submit">Login</button>
    </form>

    <a class="home" th:href="@{/}">Back to Home</a>
</div>

</body>
</html>
