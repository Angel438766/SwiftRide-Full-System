<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Login</title>
    <!-- 100%ක්ම වැඩ කරන පරිදි CSS ලින්ක් එක නිවැරදි කළා -->

    <style>
        /* උඩ මෙනු තීරුව ලස්සනට පෙනෙන්න දැමූ සරල මෝස්තර */
        nav {
            background-color: #0c2340;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        nav a:hover {
            color: #ffc107;
        }
    </style>
</head>
<body>

<!-- ඔයාට අඩුවෙන් තිබුණු ප්‍රධාන මෙනු තීරුව (Navbar) මෙන්න එකතු කළා -->

    <a href="../../index.html">Home</a>
    <a href="../about.html">About Us</a>

<h1>Passenger Login</h1>

<!-- Form Action එක සාමාන්‍ය HTML එකක් බවට පත් කළා -->
<form action="#" method="post">
    <label>Email</label><br>
    <input type="email" name="email" required>
    <br><br>

    <label>Password</label><br>
    <input type="password" name="password" required>
    <br><br>

    <button type="submit">Login</button>
</form>

<!-- යට තියෙන බොත්තම් දෙකේ ලින්ක්ස් 404 Error නොවී වැඩ කරන්න නිවැරදි කළා -->

<p><a href="../../index.html">Home</a></p>

</body>
</html>
