<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Registration</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        nav {
            background-color: #0c2340;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        nav a:hover {
            color: #ffc107;
        }
    </style>
</head>
<body>

<!-- ප්‍රධාන මෙනු තීරුව (Navbar) -->
<nav>
    <a href="../../index.html">Home</a>
    <a href="../about.html">About Us</a>
    <a href="../contact.html">Contact Us</a>
    <a href="register.html" style="color: #ffc107; font-weight: bold;">Sign Up</a>
    <a href="login.html">Passenger Login</a>
</nav>

<div style="max-width: 400px; margin: 0 auto; padding: 20px; font-family: Arial, sans-serif;">
    <h1>Passenger Registration</h1>

    <!-- 💡 405 දෝෂය සදහටම නැති කිරීමට form එක සාමාන්‍ය div එකක් බවට පත් කළා -->
    <div id="registerContainer">
        <label style="display:block; margin-top:15px; font-weight:bold;">Full Name</label>
        <input type="text" id="regName" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccd6e0; border-radius:5px;" required>

        <label style="display:block; margin-top:15px; font-weight:bold;">Email</label>
        <input type="email" id="regEmail" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccd6e0; border-radius:5px;" required>

        <label style="display:block; margin-top:15px; font-weight:bold;">Password</label>
        <input type="password" id="regPassword" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccd6e0; border-radius:5px;" required>

        <!-- 💡 type="submit" වෙනුවට button එකක් දමා onclick මඟින් ක්‍රියාත්මක කළා -->
        <button type="button" onclick="handleRegister()" style="width:100%; margin-top:20px; padding:12px; background:#ffc107; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Register</button>
    </div>

    <p style="margin-top:20px;">Already have an account? <a href="login.html" style="color:#087f8c; text-decoration:none; font-weight:bold;">Login here</a></p>
    <p><a href="../../index.html" style="color:#087f8c; text-decoration:none; font-weight:bold;">← Back to Home</a></p>
</div>

<script>
    // සර්වර් එකට නොගොස් කෙළින්ම ක්‍රියාත්මක වන ප්‍රධාන ජාවාස්ක්‍රිප්ට් එක
    function handleRegister() {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        if(!name || !email || !password) {
            alert("Please fill in all fields!");
            return;
        }

        alert("Registration Successful! Welcome to SwiftRide. Please login to continue.");

        // කෙළින්ම Passenger Login පිටුවට රැගෙන යයි
        window.location.href = "login.html";
    }
</script>

</body>
</html>
