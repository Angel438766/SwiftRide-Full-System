
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trip Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        h1 {
            color: #222;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #0759a5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #0759a5;
            color: white;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin: 3px;
        }

        .start {
            background: #198754;
        }

        .complete {
            background: #0759a5;
        }

        .disabled {
            color: #777;
        }
    </style>
</head>
<body>

<h1>Trip Management</h1>

<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/bookings}">Booking Management</a>
    <a th:href="@{/drivers}">Driver Management</a>
    <a th:href="@{/vehicles}">Vehicle Management</a>
    <a th:href="@{/passengers}">Passenger Management</a>
</nav>

<table>
    <thead>
    <tr>
        <th>Trip ID</th>
        <th>Booking ID</th>
        <th>Driver Name</th>
        <th>Pickup</th>
        <th>Destination</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="trip : ${trips}">
        <td th:text="${trip.id}"></td>
        <td th:text="${trip.bookingId}"></td>
        <td th:text="${trip.driverName}"></td>
        <td th:text="${trip.pickupLocation}"></td>
        <td th:text="${trip.destination}"></td>
        <td th:text="${trip.startTime != null ? #temporals.format(trip.startTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        <td th:text="${trip.endTime != null ? #temporals.format(trip.endTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        <td th:text="${trip.status}"></td>

        <td>
            <form th:if="${trip.status == 'NOT_STARTED' or trip.status == 'ACCEPTED'}"
                  th:action="@{/trips/start/{id}(id=${trip.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit" class="start"
                        onclick="return confirm('Start this trip?')">
                    Start Trip
                </button>
            </form>

            <form th:if="${trip.status == 'STARTED'}"
                  th:action="@{/trips/complete/{id}(id=${trip.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit" class="complete"
                        onclick="return confirm('Complete this trip?')">
                    Complete Trip
                </button>
            </form>

            <span th:if="${trip.status == 'COMPLETED' or trip.status == 'CANCELLED'}"
                  class="disabled">
                No actions
            </span>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(trips)}">
        <td colspan="9">No trips found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
