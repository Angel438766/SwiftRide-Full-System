
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages | SwiftRide</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #102a43;
        }

        header {
            background: #071b35;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 { color: #ffc629; }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .message {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            border-left: 5px solid #ffc629;
            box-shadow: 0 4px 15px #102a4310;
            overflow-wrap: anywhere;
        }

        .message h2 { color: #087f8c; }

        .message p { line-height: 1.7; }

        .date { color: #66788a; font-size: 13px; }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
        }

        .back {
            display: inline-block;
            background: #ffc629;
            color: #102a43;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>SwiftRide</h1>
    <p>Customer Contact Messages</p>
</header>

<main>
    <a class="back" th:href="@{/}">← Back to Home</a>

    <h2>Received Messages</h2>

    <div class="empty" th:if="${#lists.isEmpty(messages)}">
        <p>No contact messages received yet.</p>
    </div>

    <section class="message" th:each="item : ${messages}">
        <h2 th:text="${item.name}">Customer Name</h2>

        <p>
            <strong>Email:</strong>
            <span th:text="${item.email}">customer@email.com</span>
        </p>

        <p>
            <strong>Message:</strong>
        </p>

        <p th:text="${item.message}">Customer message</p>

        <p class="date">
            Received:
            <span th:text="${item.createdAt}">Date and time</span>
        </p>
    </section>
</main>

</body>
</html>
